services:
  psc:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - psc-data:/data
    environment:
      PSC_DATA_DIR: /data
      PSC_PASSWORD: "${PSC_PASSWORD:?Set PSC_PASSWORD in .env (at least 12 characters)}"
      PSC_ALLOWED_HOSTS: "${PSC_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    read_only: true
    tmpfs:
      - /tmp:size=300m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  psc-data:
